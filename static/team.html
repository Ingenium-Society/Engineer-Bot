<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Engineer-Bot</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="team">
<div class="team">
  <header class="team-head">
    <div>
      <div class="eyebrow">The Engineer-Bot</div>
      <h1 class="team-name" id="team-name">TIM</h1>
      <div class="team-counter" id="counter">Pemain 1 dari 14 &middot; Sisa instruksi: 14</div>
    </div>
    <div class="turn-clock" id="turn-clock">--</div>
  </header>

  <main class="team-main">
    <section class="prompt-area">
      <div class="status-line" id="status">Menunggu ronde dimulai</div>
      <form class="answer-row" id="answer-form" autocomplete="off">
        <button id="mic" class="mic" type="button" hidden
                title="Bicara (tekan spasi)" aria-label="Bicara">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 15Z"/>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/>
          </svg>
        </button>
        <input id="answer" maxlength="80" placeholder="Ketik satu instruksi..." disabled
               autocapitalize="off" spellcheck="false">
        <button id="send" class="primary" type="submit" disabled>Kirim</button>
      </form>
      <div class="voice" id="voice" hidden>
        <div class="voice-line" id="voice-line"></div>
      </div>
      <div class="hint" id="hint">Satu perintah, satu langkah. Tekan Enter untuk mengirim.</div>
    </section>

    <section class="history-wrap">
      <div class="eyebrow">Riwayat instruksi</div>
      <ol class="history" id="history"></ol>
    </section>
  </main>

  <footer class="team-foot">
    <span id="round-clock">Sisa ronde --:--</span>
    <label class="toggle"><input type="checkbox" id="tts"> Suara</label>
  </footer>
</div>

<div class="banner" id="banner" hidden>
  <div>
    <h2 id="banner-title"></h2>
    <p id="banner-text"></p>
  </div>
</div>

<script src="/static/voice.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
